<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verhuisd naar Enigma Mystery</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.enigmamystery.com/wandel/nl/ooggetuige.html">
<script>
(function(){
  var pad = "nl/ooggetuige.html";
  var doel = "https://www.enigmamystery.com/wandel/" + (pad === null ? location.pathname.replace(/^\//, "") : pad);
  var q = location.search ? location.search.slice(1) : "";
  /* voortgang en codes meenemen naar het nieuwe adres */
  try {
    var o = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^ss_/.test(k) && !/^ss_(ways|map)/.test(k)) { o[k] = localStorage.getItem(k); n++; } }
    if (n) {
      var j = JSON.stringify(o);
      if (j.length > 40000) { Object.keys(o).forEach(function (k) { if (/^ss_game/.test(k)) delete o[k]; }); j = JSON.stringify(o); }
      var b = btoa(unescape(encodeURIComponent(j))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      q = (q ? q + "&" : "") + "mwimport=" + b;
    }
  } catch (e) {}
  location.replace(doel + (q ? "?" + q : "") + location.hash);
})();
</script>
<meta http-equiv="refresh" content="3; url=https://www.enigmamystery.com/wandel/nl/ooggetuige.html">
